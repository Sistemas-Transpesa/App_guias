name: guias_transportista
description: "Aplicación móvil multiplataforma para gestión de guías transportista - Transpesa"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Arquitectura & Inyección de Dependencias
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  equatable: ^2.0.5

  # Navegación
  go_router: ^13.2.0

  # Networking & HTTP
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Almacenamiento Seguro & Local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Serialización & Modelos
  json_annotation: ^4.8.1

  # Utilidades de UI & Fechas
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0

  # Visualización de PDF y Enlaces
  url_launcher: ^6.2.3
  open_filex: ^4.4.0
  path_provider: ^2.1.2

  # Manejo de Entornos (.env)
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - .env
